[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "printer-goblin"
version = "0.1.0"
description = "Printer security awareness and network segmentation testing utility (authorized use only)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["segno>=1.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
printer-goblin = "printer_goblin.cli:main"

[tool.setuptools.packages.find]
include = ["printer_goblin*"]
namespaces = false

[tool.setuptools.package-data]
printer_goblin = ["assets/*.pbm", "assets/*.png"]
"printer_goblin.gui" = ["static/*.html", "static/*.js", "static/*.css"]
