[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "printer-gremlin"
version = "0.1.0"
description = "Printer security awareness and network segmentation testing utility (authorized use only)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["segno>=1.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
printer-gremlin = "printer_gremlin.cli:main"

[tool.setuptools.packages.find]
include = ["printer_gremlin*"]
